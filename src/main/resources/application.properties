spring.application.name=oscar-api

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:oscardb}
spring.datasource.username=${PGUSER:oscar}
spring.datasource.password=${PGPASSWORD:oscar}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

jwt.secret=${JWT_SECRET:oscar-secret-key-must-be-at-least-32-chars-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

  Senhas dos usuários seed — obrigatórias via variável de ambiente
# Defina localmente via run configuration ou .env (com spring-dotenv)
